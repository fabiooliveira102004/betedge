<!doctype html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetEdge — a tua vantagem sobre o mercado</title>
<meta name="description" content="Analise de apostas com modelo estatistico e leitura de contexto. Apostas de valor sobre as odds da Betclic, com historico verificavel.">

<meta name="theme-color" content="#08090C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BetEdge">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>

<a class="skip-link" href="#main">Saltar para o conteudo</a>

<!-- ══ Cabecalho ═══════════════════════════════════════════════════════ -->
<header class="appbar" role="banner">
  <div class="appbar__inner">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M4 24 L11 13 L17 19 L28 6" fill="none" stroke="currentColor"
              stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28" cy="6" r="3.2" fill="currentColor"/>
      </svg>
      <span class="brand__name">Bet<span class="brand__accent">Edge</span></span>
    </div>

    <div class="appbar__actions">
      <button type="button" class="icon-btn" id="theme-toggle"
              aria-label="Alternar tema claro e escuro">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sun">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-moon">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>

      <button type="button" class="avatar-btn" id="account-btn"
              aria-label="Conta" aria-haspopup="dialog">
        <span class="avatar" id="avatar-initials" aria-hidden="true">?</span>
      </button>
    </div>
  </div>

  <div class="banner banner--offline" id="offline-banner" role="status" hidden>
    Sem ligacao — a mostrar os ultimos dados guardados.
  </div>
  <div class="banner banner--demo" id="demo-banner" role="status" hidden>
    <strong>Jogos de exemplo</strong> — nao correspondem a jogos reais.
  </div>
</header>

<!-- ══ Conteudo ════════════════════════════════════════════════════════ -->
<main id="main" class="main" tabindex="-1">

  <!-- ── Apostas ────────────────────────────────────────────────────── -->
  <section class="view" id="view-picks" role="tabpanel" aria-labelledby="tab-picks">
    <div class="view__head">
      <div>
        <h1 class="view__title">Apostas de valor</h1>
        <p class="view__sub" id="picks-meta">A carregar…</p>
      </div>
      <button type="button" class="icon-btn" id="refresh-btn" aria-label="Atualizar dados">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"
                fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="bankroll-strip" id="bankroll-strip" hidden>
      <span class="bankroll-strip__label">Banca</span>
      <output class="bankroll-strip__value num" id="bankroll-value">—</output>
      <button type="button" class="link-btn" id="edit-bankroll">alterar</button>
    </div>

    <div class="filters" role="group" aria-label="Filtrar apostas">
      <div class="chips" id="league-filters"></div>
      <div class="chips chips--secondary">
        <button type="button" class="chip" data-conf="all" aria-pressed="true">Todas</button>
        <button type="button" class="chip" data-conf="high" aria-pressed="false">Confianca alta</button>
        <button type="button" class="chip" data-conf="value" aria-pressed="false">Maior vantagem</button>
      </div>
    </div>

    <div id="picks-list" class="stack" aria-live="polite" aria-busy="true"></div>
  </section>

  <!-- ── Historico ──────────────────────────────────────────────────── -->
  <section class="view" id="view-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    <div class="view__head">
      <div>
        <h1 class="view__title">Historico</h1>
        <p class="view__sub" id="history-meta">A carregar…</p>
      </div>
    </div>

    <div class="segmented" role="group" aria-label="Filtrar historico">
      <button type="button" class="segmented__item is-active" data-result="all" aria-pressed="true">Todas</button>
      <button type="button" class="segmented__item" data-result="win" aria-pressed="false">Ganhas</button>
      <button type="button" class="segmented__item" data-result="loss" aria-pressed="false">Perdidas</button>
    </div>

    <div id="history-list" class="stack" aria-live="polite"></div>
    <button type="button" class="btn btn--ghost btn--block" id="history-more" hidden>
      Mostrar mais
    </button>
  </section>

  <!-- ── Estatisticas ───────────────────────────────────────────────── -->
  <section class="view" id="view-stats" role="tabpanel" aria-labelledby="tab-stats" hidden>
    <div class="view__head">
      <div>
        <h1 class="view__title">Desempenho</h1>
        <p class="view__sub" id="stats-meta">A carregar…</p>
      </div>
    </div>
    <div id="stats-body" class="stack"></div>
  </section>

  <!-- ── Perfil ─────────────────────────────────────────────────────── -->
  <section class="view" id="view-profile" role="tabpanel" aria-labelledby="tab-profile" hidden>
    <div class="view__head">
      <div>
        <h1 class="view__title">Conta</h1>
        <p class="view__sub" id="profile-meta">—</p>
      </div>
    </div>
    <div id="profile-body" class="stack"></div>
  </section>

</main>

<!-- ══ Navegacao ═══════════════════════════════════════════════════════ -->
<nav class="tabbar" role="tablist" aria-label="Navegacao principal">
  <button type="button" class="tabbar__item is-active" id="tab-picks"
          role="tab" aria-selected="true" aria-controls="view-picks" data-view="picks">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 17.5 9 9.8l4 4.2 7.5-9" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15.5 5.2h5v5" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Apostas</span>
  </button>

  <button type="button" class="tabbar__item" id="tab-history"
          role="tab" aria-selected="false" aria-controls="view-history" data-view="history">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 7.2V12l3.2 2" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Historico</span>
  </button>

  <button type="button" class="tabbar__item" id="tab-stats"
          role="tab" aria-selected="false" aria-controls="view-stats" data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4.5 19.5V13M11 19.5V6M17.5 19.5v-8" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Estatisticas</span>
  </button>

  <button type="button" class="tabbar__item" id="tab-profile"
          role="tab" aria-selected="false" aria-controls="view-profile" data-view="profile">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M4.8 20a7.4 7.4 0 0 1 14.4 0" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Conta</span>
  </button>
</nav>

<!-- ══ Camadas ═════════════════════════════════════════════════════════ -->

<!-- Analise completa de uma aposta. E uma vista propria, com o seu proprio
     endereco, para que o botao "voltar" do telemovel a feche em vez de sair
     da app. -->
<div class="detail-root" id="detail-root" hidden>
  <header class="detail-bar">
    <button type="button" class="icon-btn" data-action="close-detail" aria-label="Voltar as apostas">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="detail-bar__title">Analise</span>
  </header>
  <div class="detail-scroll" id="detail-body" tabindex="-1"></div>
</div>

<div class="sheet-root" id="sheet-root" hidden>
  <div class="sheet__scrim" data-close-sheet></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__grip" aria-hidden="true"></div>
    <header class="sheet__head">
      <h2 class="sheet__title" id="sheet-title"></h2>
      <button type="button" class="icon-btn" data-close-sheet aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
