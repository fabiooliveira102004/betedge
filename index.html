<!doctype html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetEdge — analise de jogos e odds</title>
<meta name="description" content="Ve os jogos que vem ai, o que um modelo estatistico calcula para cada resultado, e como isso se compara com as odds da Betclic. Ferramenta de analise, nao de apostas.">

<meta name="theme-color" content="#08090C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BetEdge">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>

<a class="skip-link" href="#main">Saltar para o conteudo</a>

<!-- ══ Cabecalho ═══════════════════════════════════════════════════════ -->
<header class="appbar" role="banner">
  <div class="appbar__inner">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M4 24 L11 13 L17 19 L28 6" fill="none" stroke="currentColor"
              stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28" cy="6" r="3.2" fill="currentColor"/>
      </svg>
      <span class="brand__name">Bet<span class="brand__accent">Edge</span></span>
    </div>

    <div class="appbar__actions">
      <button type="button" class="icon-btn" id="refresh-btn" aria-label="Atualizar dados">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"
                fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" id="theme-toggle"
              aria-label="Alternar tema claro e escuro">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sun">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-moon">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="banner banner--offline" id="offline-banner" role="status" hidden>
    Sem ligacao — a mostrar os ultimos dados guardados.
  </div>
  <div class="banner banner--demo" id="demo-banner" role="status" hidden>
    <strong>Jogos de exemplo</strong> — nao correspondem a jogos reais.
  </div>
</header>

<!-- ══ Conteudo ════════════════════════════════════════════════════════ -->
<main id="main" class="main" tabindex="-1">

  <!-- ── Jogos ──────────────────────────────────────────────────────── -->
  <section class="view" id="view-matches" role="tabpanel" aria-labelledby="tab-matches">
    <div class="view__head">
      <div>
        <h1 class="view__title">Proximos jogos</h1>
        <p class="view__sub" id="matches-meta">A carregar…</p>
      </div>
    </div>

    <div class="filters" role="group" aria-label="Filtrar jogos">
      <div class="chips" id="league-filters"></div>
      <div class="chips chips--secondary">
        <button type="button" class="chip" id="value-filter" data-toggle="value" aria-pressed="false">
          So jogos com odds generosas
        </button>
      </div>
    </div>

    <div id="matches-list" class="stack" aria-live="polite" aria-busy="true"></div>
  </section>

  <!-- ── Resultados ─────────────────────────────────────────────────── -->
  <section class="view" id="view-results" role="tabpanel" aria-labelledby="tab-results" hidden>
    <div class="view__head">
      <div>
        <h1 class="view__title">Jogos passados</h1>
        <p class="view__sub" id="results-meta">A carregar…</p>
      </div>
    </div>

    <div id="results-list" class="stack" aria-live="polite"></div>
    <button type="button" class="btn btn--ghost btn--block" id="results-more" hidden>
      Mostrar mais
    </button>
  </section>

  <!-- ── Modelo ─────────────────────────────────────────────────────── -->
  <section class="view" id="view-model" role="tabpanel" aria-labelledby="tab-model" hidden>
    <div class="view__head">
      <div>
        <h1 class="view__title">O modelo</h1>
        <p class="view__sub" id="model-meta">A carregar…</p>
      </div>
    </div>
    <div id="model-body" class="stack"></div>
  </section>

  <!-- ── Sobre ──────────────────────────────────────────────────────── -->
  <section class="view" id="view-about" role="tabpanel" aria-labelledby="tab-about" hidden>
    <div class="view__head">
      <div>
        <h1 class="view__title">Como funciona</h1>
        <p class="view__sub" id="about-meta">—</p>
      </div>
    </div>
    <div id="about-body" class="stack"></div>
  </section>

</main>

<!-- ══ Navegacao ═══════════════════════════════════════════════════════ -->
<nav class="tabbar" role="tablist" aria-label="Navegacao principal">
  <button type="button" class="tabbar__item is-active" id="tab-matches"
          role="tab" aria-selected="true" aria-controls="view-matches" data-view="matches">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <path d="M12 3.5v17M3.5 12h17" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span>Jogos</span>
  </button>

  <button type="button" class="tabbar__item" id="tab-results"
          role="tab" aria-selected="false" aria-controls="view-results" data-view="results">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 7.2V12l3.2 2" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Resultados</span>
  </button>

  <button type="button" class="tabbar__item" id="tab-model"
          role="tab" aria-selected="false" aria-controls="view-model" data-view="model">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4.5 19.5V13M11 19.5V6M17.5 19.5v-8" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Modelo</span>
  </button>

  <button type="button" class="tabbar__item" id="tab-about"
          role="tab" aria-selected="false" aria-controls="view-about" data-view="about">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <path d="M12 11v5.5M12 7.6v.9" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Sobre</span>
  </button>
</nav>

<!-- ══ Camadas ═════════════════════════════════════════════════════════ -->

<!-- Analise de um jogo. Vista propria, com o seu proprio endereco, para que
     o botao "voltar" do telemovel a feche em vez de sair da app. -->
<div class="detail-root" id="detail-root" hidden>
  <header class="detail-bar">
    <button type="button" class="icon-btn" data-action="close-detail" aria-label="Voltar aos jogos">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="detail-bar__title" id="detail-bar-title">Analise do jogo</span>
  </header>
  <div class="detail-scroll" id="detail-body" tabindex="-1"></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
