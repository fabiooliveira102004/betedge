name: Publicar app

# Publica a app no GitHub Pages. Nao ha passo de build: a app e HTML, CSS e
# modulos ES nativos, servidos tal como estao no repositorio.
on:
  push:
    branches: [master, main]

  # O GitHub nao dispara workflows a partir de commits feitos com o
  # GITHUB_TOKEN — e a protecao contra ciclos infinitos. Sem isto, a analise
  # gravava os dados novos e o site continuava a servir os antigos, congelado
  # no ultimo push humano. `workflow_run` nao sofre dessa restricao.
  workflow_run:
    workflows: ['Analisar apostas']
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nao cancelamos uma publicacao a meio; deixamos terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Ativa o Pages na primeira execucao. Sem isto o passo falha com
          # "Get Pages site failed" ate alguem o ligar a mao nas definicoes.
          enablement: true

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          # O motor nao vai para producao: so os JSON que ele produz.
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
